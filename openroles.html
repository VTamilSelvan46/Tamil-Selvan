<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenRoles — Careers Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --sidebar-bg: #FAFAFA;
    --border: #E4E4E4;
    --ink: #111111;
    --ink-dim: #6B6B6B;
    --ink-faint: #A8A8A8;
    --hover: #F0F0F0;
    --sidebar-w: 280px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: var(--ink); }

  /* ---------------- Top bar ---------------- */
  .topbar{
    height: 60px;
    border-bottom: 1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 0 24px;
  }
  .topbar .brand{
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.01em;
  }
  .topbar .brand span{ color: var(--ink-faint); font-weight: 400; margin-left: 8px; font-size: 12.5px; }
  .topbar-right{ display:flex; align-items:center; gap: 18px; }
  .datetime{ text-align:right; line-height:1.3; }
  .datetime .time{ font-size: 13.5px; font-weight: 600; }
  .datetime .date{ font-size: 11.5px; color: var(--ink-faint); }
  .user-chip{ display:flex; align-items:center; gap: 10px; font-size: 12.5px; color: var(--ink-dim); }
  .user-chip span{ font-weight: 600; color: var(--ink); }
  .user-chip a{ cursor:pointer; text-decoration: underline; font-weight: 500; color: var(--ink-dim); }
  .user-chip a:hover{ color: var(--ink); }

  /* ---------------- App shell ---------------- */
  .shell{
    display:grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: calc(100vh - 60px);
  }
  @media (max-width: 820px){
    .shell{ grid-template-columns: 1fr; }
    .sidebar{ border-right:none; border-bottom: 1px solid var(--border); max-height: 260px; }
  }

  /* ---------------- Sidebar ---------------- */
  .sidebar{
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 18px 0 40px;
  }
  .sidebar-group{ margin-bottom: 22px; }
  .sidebar-group-label{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 0 20px;
    margin-bottom: 8px;
    display:flex;
    align-items:center;
    gap: 7px;
  }
  .shade-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .company-item{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 20px;
    cursor:pointer;
    font-size: 13.5px;
    border-left: 2px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .company-item:hover{ background: var(--hover); }
  .company-item.active{
    background: #EFEFEF;
    border-left-color: var(--ink);
    font-weight: 600;
  }
  .company-item .count{
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink:0;
  }

  /* ---------------- Main panel ---------------- */
  .main{ padding: 34px 40px; max-width: 720px; }
  @media (max-width: 620px){ .main{ padding: 24px 20px; } }

  .empty-state{
    color: var(--ink-faint);
    font-size: 14.5px;
    padding-top: 60px;
    text-align:center;
  }

  .panel-header{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .panel-header h2{ margin:0; font-size: 19px; font-weight: 700; }
  .panel-header .shade-tag{
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 3px;
  }

  .role-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 16px 4px;
    border-top: 1px solid var(--border);
    cursor:pointer;
    transition: padding-left 0.15s ease;
  }
  .role-row:first-child{ border-top:none; }
  .role-row:hover{ padding-left: 10px; }
  .role-row .rt{ font-size: 15px; font-weight: 600; }
  .role-row .rl{ font-size: 12.5px; color: var(--ink-faint); margin-top:3px; }
  .role-row .arrow{ color: var(--ink-faint); }

  .back-link{
    font-size: 13px;
    color: var(--ink-dim);
    cursor:pointer;
    margin-bottom: 18px;
    display:inline-block;
  }
  .back-link:hover{ color: var(--ink); }

  .job-title{ font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .job-loc{ font-size: 13.5px; color: var(--ink-faint); margin-bottom: 26px; }
  .job-desc-label{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .job-desc{ font-size: 15px; line-height: 1.75; color: var(--ink); max-width: 62ch; }

  .apply-bar{
    margin-top: 32px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }
  .apply-bar .note{ font-size: 12.5px; color: var(--ink-faint); max-width: 36ch; }
  .apply-btn{
    background: var(--ink);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 22px;
    border-radius: 4px;
    text-decoration:none;
  }
  .apply-btn:hover{ background: #333; }

  /* ---------------- Login ---------------- */
  .login-screen{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--bg);
  }
  .login-card{
    width: 100%;
    max-width: 380px;
    padding: 20px;
    text-align:center;
  }
  .login-mark{ font-weight: 700; font-size: 20px; margin-bottom: 8px; }
  .login-card h2{ font-size: 20px; margin: 0 0 8px; font-weight: 700; }
  .login-card .sub{ font-size: 13.5px; color: var(--ink-dim); margin-bottom: 28px; }
  .google-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    padding: 12px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family:'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    cursor:pointer;
  }
  .google-btn:hover{ background: var(--hover); }
  .login-note{ margin-top: 14px; font-size: 12px; color: var(--ink-faint); display:none; }
  .login-note.show{ display:block; }
  .login-hint{ margin-top: 20px; font-size: 11.5px; color: var(--ink-faint); line-height:1.5; }

  .load-progress{ font-size: 12px; color: var(--ink-faint); padding: 10px 20px; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="screen-login">
  <div class="login-card">
    <div class="login-mark">OPENROLES</div>
    <h2>Sign in to continue</h2>
    <div class="sub">Sign in with Google to browse open roles and apply.</div>
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.93c1.71-1.58 2.68-3.9 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.93-2.27c-.81.55-1.85.87-3.03.87-2.33 0-4.3-1.57-5.01-3.68H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.99 10.75c-.18-.55-.29-1.13-.29-1.75s.11-1.2.29-1.75V4.91H.96C.35 6.12 0 7.52 0 9s.35 2.88.96 4.09l3.03-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.6-2.6C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.91l3.03 2.34C4.7 5.15 6.67 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
    <div class="login-note" id="login-note">Signing you in…</div>
    <div class="login-hint">By continuing, your Google email is recorded for this app's user list.</div>
  </div>
</div>

<!-- APP SHELL (hidden until signed in) -->
<div id="screen-app" class="hidden">
  <div class="topbar">
    <div class="brand">OPENROLES <span>careers directory</span></div>
    <div class="topbar-right">
      <div class="datetime">
        <div class="time" id="clock-time">—:—</div>
        <div class="date" id="clock-date">—</div>
      </div>
      <div class="user-chip">
        <span id="user-email-display"></span>
        <a onclick="handleSignOut()">Sign out</a>
      </div>
    </div>
  </div>

  <div class="shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="main">
      <div class="empty-state">Select a company from the list to see open roles.</div>
    </div>
  </div>
</div>

<script>
  const CATEGORIES = {
    "IT Services & Consulting": { shade: "#3A3A3A", soft: "#EDEDED" },
    "Product & SaaS":           { shade: "#6B6B6B", soft: "#F1F1F1" },
    "Engineering & Hardware":   { shade: "#9A9A9A", soft: "#F4F4F4" }
  };

  const COMPANY_CATEGORY = {
    "TCS": "IT Services & Consulting", "Cognizant": "IT Services & Consulting",
    "Infosys": "IT Services & Consulting", "Wipro": "IT Services & Consulting",
    "HCLTech": "IT Services & Consulting", "Accenture": "IT Services & Consulting",
    "Capgemini": "IT Services & Consulting", "LTIMindtree": "IT Services & Consulting",
    "Tech Mahindra": "IT Services & Consulting", "Hexaware": "IT Services & Consulting",
    "Mphasis": "IT Services & Consulting", "DXC Technology": "IT Services & Consulting",
    "NTT DATA": "IT Services & Consulting", "Virtusa": "IT Services & Consulting",
    "Coforge": "IT Services & Consulting", "UST": "IT Services & Consulting",
    "Kyndryl": "IT Services & Consulting", "Sutherland": "IT Services & Consulting",
    "Movate": "IT Services & Consulting", "Prodapt": "IT Services & Consulting",
    "Aspire Systems": "IT Services & Consulting",
    "Zoho": "Product & SaaS", "Freshworks": "Product & SaaS", "Kovai.co": "Product & SaaS",
    "KGISL": "Engineering & Hardware", "Pricol": "Engineering & Hardware",
    "ELGI Equipments": "Engineering & Hardware", "Infineon": "Engineering & Hardware",
    "Bosch": "Engineering & Hardware", "ZF": "Engineering & Hardware"
  };

  const COMPANY_NAMES = Object.keys(COMPANY_CATEGORY);

  const COMPANY_QUERY_OVERRIDE = {
    "TCS": "Tata Consultancy Services",
    "ZF": "ZF Friedrichshafen",
    "UST": "UST Global"
  };
  const COMPANY_MATCH_TOKENS = {
    "TCS": ["tata consultancy", "tcs"],
    "ZF": ["zf friedrichshafen", "zf group"],
    "UST": ["ust global", "ust inc"]
  };

  const ADZUNA_APP_ID = "dbf222e3";
  const ADZUNA_APP_KEY = "cc605390503f70836dfbd16cc9d10cdb";
  const COUNTRY = "in";

  const companyState = {};
  COMPANY_NAMES.forEach(name => { companyState[name] = { status: 'loading', jobs: [] }; });

  let currentCompany = null;

  function firstToken(name){ return name.toLowerCase().split(/[\s.]+/)[0]; }
  function getMatchTokens(name){ return COMPANY_MATCH_TOKENS[name] || [firstToken(name)]; }

  async function fetchCompanyJobs(name){
    const query = COMPANY_QUERY_OVERRIDE[name] || name;
    const url = `https://api.adzuna.com/v1/api/jobs/${COUNTRY}/search/1?app_id=${ADZUNA_APP_ID}&app_key=${ADZUNA_APP_KEY}&results_per_page=20&what=${encodeURIComponent(query)}&content-type=application/json`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const tokens = getMatchTokens(name);
    return (data.results || []).filter(j =>
      j.company && j.company.display_name &&
      tokens.some(t => j.company.display_name.toLowerCase().includes(t))
    );
  }

  async function loadAllCompanies(){
    for (let i = 0; i < COMPANY_NAMES.length; i++){
      const name = COMPANY_NAMES[i];
      try {
        companyState[name] = { status: 'done', jobs: await fetchCompanyJobs(name) };
      } catch (err) {
        console.error('Adzuna fetch failed for', name, err);
        companyState[name] = { status: 'error', jobs: [] };
      }
      renderSidebar();
      if (i < COMPANY_NAMES.length - 1) await new Promise(r => setTimeout(r, 2200));
    }
  }

  function renderSidebar(){
    const el = document.getElementById('sidebar');
    const byCategory = {};
    COMPANY_NAMES.forEach(name => {
      const cat = COMPANY_CATEGORY[name];
      (byCategory[cat] = byCategory[cat] || []).push(name);
    });

    el.innerHTML = Object.entries(byCategory).map(([catName, names]) => {
      const cat = CATEGORIES[catName];
      const items = names.map(name => {
        const state = companyState[name];
        const isActive = currentCompany === name;
        let countLabel = '…';
        if (state.status === 'done') countLabel = state.jobs.length + ' open';
        if (state.status === 'error') countLabel = 'n/a';
        return `
          <div class="company-item ${isActive ? 'active' : ''}" onclick="openCompany('${name.replace(/'/g, "\\'")}')">
            <span>${name}</span>
            <span class="count">${countLabel}</span>
          </div>`;
      }).join('');
      return `
        <div class="sidebar-group">
          <div class="sidebar-group-label"><span class="shade-dot" style="background:${cat.shade};"></span>${catName}</div>
          ${items}
        </div>`;
    }).join('');
  }

  function openCompany(name){
    currentCompany = name;
    renderSidebar();
    const state = companyState[name];
    const cat = CATEGORIES[COMPANY_CATEGORY[name]];
    const main = document.getElementById('main');

    let bodyHtml;
    if (state.status === 'loading'){
      bodyHtml = `<div class="empty-state">Still loading live listings for ${name}…</div>`;
    } else if (state.status === 'error' || state.jobs.length === 0){
      bodyHtml = `<div class="empty-state">No matching openings found right now for ${name}.</div>`;
    } else {
      bodyHtml = state.jobs.map((job, i) => `
        <div class="role-row" onclick="openJob(${i})">
          <div>
            <div class="rt">${job.title}</div>
            <div class="rl">${job.location && job.location.display_name ? job.location.display_name : 'Location not specified'}</div>
          </div>
          <span class="arrow">›</span>
        </div>
      `).join('');
    }

    main.innerHTML = `
      <div class="panel-header">
        <h2>${name}</h2>
        <span class="shade-tag" style="color:${cat.shade}; background:${cat.soft};">${COMPANY_CATEGORY[name]}</span>
      </div>
      ${bodyHtml}
    `;
  }

  function openJob(index){
    const job = companyState[currentCompany].jobs[index];
    const cat = CATEGORIES[COMPANY_CATEGORY[currentCompany]];
    const main = document.getElementById('main');
    main.innerHTML = `
      <span class="back-link" onclick="openCompany('${currentCompany.replace(/'/g, "\\'")}')">← ${currentCompany} roles</span>
      <div class="job-title">${job.title}</div>
      <div class="job-loc">${currentCompany} · ${job.location && job.location.display_name ? job.location.display_name : ''}</div>
      <div class="job-desc-label">Description</div>
      <div class="job-desc">${job.description || 'No further description provided.'}</div>
      <div class="apply-bar">
        <span class="note">You'll be taken to the original job listing to apply.</span>
        <a class="apply-btn" href="${job.redirect_url}" target="_blank" rel="noopener noreferrer" style="background:${cat.shade};">Apply for this role →</a>
      </div>
    `;
  }

  function updateClock(){
    const now = new Date();
    document.getElementById('clock-time').textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    document.getElementById('clock-date').textContent = now.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short', year:'numeric'});
  }
</script>

<!--
  ========================================================================
  GOOGLE SIGN-IN (Firebase) — config already filled in for the OpenRoles
  Firebase project. Every sign-in is recorded in Firestore under
  "signed_in_users" with email, name, and last sign-in time.
  ========================================================================
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDzxe24Uyj9pgu7c8RpoWKptn4LyX8Etzs",
    authDomain: "openroles-2ca85.firebaseapp.com",
    projectId: "openroles-2ca85",
    storageBucket: "openroles-2ca85.firebasestorage.app",
    messagingSenderId: "268608284580",
    appId: "1:268608284580:web:6bc7e847f825ea2e928331",
    measurementId: "G-TCP9XWM152"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  window.signInWithGoogle = async function () {
    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;
      await setDoc(doc(db, "signed_in_users", user.uid), {
        email: user.email,
        name: user.displayName,
        lastSignIn: serverTimestamp()
      }, { merge: true });
    } catch (err) {
      console.error("Sign-in error:", err);
      alert("Sign-in failed. Check that Google sign-in is enabled in your Firebase project.");
    }
  };

  window.handleSignOut = function () {
    signOut(auth);
  };

  onAuthStateChanged(auth, (user) => {
    const loginScreen = document.getElementById('screen-login');
    const appScreen = document.getElementById('screen-app');
    if (user) {
      document.getElementById('user-email-display').textContent = user.email;
      loginScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      updateClock();
      setInterval(updateClock, 1000);
      renderSidebar();
      loadAllCompanies();
    } else {
      loginScreen.classList.remove('hidden');
      appScreen.classList.add('hidden');
    }
  });
</script>

</body>
</html>
